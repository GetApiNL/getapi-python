[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getapi"
dynamic = ["version"]
description = "Python-client voor GetAPI.nl: KVK, BTW/VAT, BAG-adres, WOZ, energielabel en meer Nederlandse data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "GetAPI.nl", email = "info@getapi.nl" }]
keywords = ["getapi", "kvk", "btw", "vat", "vies", "bag", "postcode", "woz", "energielabel", "rdw", "netherlands", "dutch", "nederland"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: Dutch",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.24,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.10"]

[project.urls]
Homepage = "https://getapi.nl"
Documentation = "https://getapi.nl/docs"
Repository = "https://github.com/GetApiNL/getapi-python"
Issues = "https://github.com/GetApiNL/getapi-python/issues"

[tool.hatch.version]
path = "src/getapi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/getapi"]

[tool.hatch.build.targets.sdist]
include = ["src/getapi", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=getapi --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = ["@abstractmethod"]

[tool.ruff]
line-length = 130
target-version = "py38"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "A", "SIM", "C4", "PT", "RUF", "N", "PL", "TRY", "RET"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "TRY003", "TRY300"]

[tool.ruff.lint.per-file-ignores]
"src/getapi/errors.py" = ["A001"]
"src/getapi/__init__.py" = ["A004"]
"src/getapi/client.py" = ["A004"]
"src/getapi/_transport.py" = ["PLR0911"]
"tests/*" = ["A004", "E501", "PLR0915"]

[tool.mypy]
strict = true
files = ["src", "tests"]
